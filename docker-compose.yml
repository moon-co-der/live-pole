services:
  mongodb:
    image: mongo:8
    container_name: livepoll-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - livepoll-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: livepoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  livepoll-mongo-data:
