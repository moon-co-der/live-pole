<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>Create a poll · LivePoll</title><link rel="stylesheet" href="/styles.css"><script src="/create.js" defer></script></head>
<body><main class="page"><section class="card"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 19v-6M13 24V8M19 20v-8M25 23V9"/></svg><span>livepoll</span></div><div class="status"><i class="dot"></i><span>CREATE A POLL</span></div><h1>Create your poll</h1><p class="create-intro">Ask a question and share the results live.</p>
<form id="create-form"><div class="field"><label for="question">Your question</label><input id="question" name="question" maxlength="180" minlength="4" required placeholder="What would you like to ask?"></div><div class="field"><label>Answer options (2–6)</label><div id="options"></div><button id="add" class="add" type="button">+ Add an option</button></div><button id="submit" class="vote" type="submit">Create poll</button></form><p id="error" class="error" role="alert"></p><div id="created" class="created hidden" aria-live="polite"><p>Your poll is ready to share</p><div class="share"><input id="link" readonly aria-label="Poll link"><button id="copy" type="button">Copy</button></div><a id="open" class="share-link" target="_blank" rel="noopener">Open poll ↗</a><button id="admin" class="admin hidden" type="button">Close this poll</button></div></section></main></body></html>
