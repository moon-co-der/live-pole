services:
  - type: web
    name: livepoll-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: /app/livepoll
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 15
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://frontend-tcln-git-main-moon-co-ders-projects.vercel.app
      - key: COOKIE_SECURE
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
